[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-modeling"
version = "0.6.0"
description = "Replaceable-operator analytical model for TP, EP, and PP Transformer inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Transformer Modeling Project"}]
dependencies = []

[project.optional-dependencies]
desktop = ["pywebview>=5.4"]
desktop-build = ["pywebview>=5.4", "pyinstaller>=6.0"]

[project.scripts]
transformer-model = "transformer_modeling.cli:main"
transformer-model-visual = "transformer_modeling.visual_app.server:main"

[tool.setuptools.package-data]
"transformer_modeling.visual_app" = ["static/**/*"]

[tool.setuptools.packages.find]
include = ["transformer_modeling*"]
